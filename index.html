        body.dark .modal-section-text { color: var(--stone-400); }

        .modal-description-first {
            font-size: 1rem;
            color: var(--stone-700);
            line-height: 1.6;
            margin-bottom: 0.75rem;
        }
        body.dark .modal-description-first { color: var(--stone-300); }

        .modal-description {
            font-size: 0.875rem;
            color: var(--stone-600);
            line-height: 1.6;
            margin-bottom: 0.75rem;
        }
        body.dark .modal-description { color: var(--stone-400); }

        .modal-icon {
            width: 1rem;
            height: 1rem;
            flex-shrink: 0;
        }

        .modal-link {
            color: var(--sienna-600);
            text-decoration: none;
            transition: color 0.2s;
        }
        .modal-link:hover { color: var(--sienna-700); }
        body.dark .modal-link { color: var(--sienna-400); }
        body.dark .modal-link:hover { color: var(--sienna-300); }

        .modal-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .modal-tag {
            display: inline-block;
            padding: 0.25rem 0.625rem;
            font-size: 0.75rem;
            font-weight: 500;
            background: var(--stone-100);
            color: var(--stone-700);
            border-radius: 0.375rem;
            text-transform: capitalize;
        }
        body.dark .modal-tag {
            background: var(--stone-800);
            color: var(--stone-300);
        }

        .modal-section a {
            color: var(--sienna-600);
            text-decoration: none;
            transition: text-decoration 0.2s;
        }
        .modal-section a:hover { text-decoration: underline; }
        body.dark .modal-section a { color: var(--sienna-400); }

        .modal-actions {
            padding-top: 1.5rem;
            margin-top: 1.5rem;
            border-top: 1px solid var(--stone-200);
        }
        body.dark .modal-actions { border-color: var(--stone-800); }

        .modal-btn {
            padding: 0.625rem 1.25rem;
            font-size: 0.875rem;
            font-weight: 500;
            background: var(--stone-900);
            color: white;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .modal-btn:hover { background: var(--stone-800); }
        body.dark .modal-btn { background: var(--stone-700); }
        body.dark .modal-btn:hover { background: var(--stone-600); }

        .modal-hours { display: flex; flex-direction: column; gap: 0.15rem; font-size: 0.8125rem; }
        .modal-hours-row { display: flex; justify-content: space-between; gap: 1rem; color: var(--stone-600); }
        .modal-hours-row.is-today { color: var(--stone-900); font-weight: 600; }
        body.dark .modal-hours-row { color: var(--stone-400); }
        body.dark .modal-hours-row.is-today { color: var(--stone-100); }

        /* Mobile card list — phones get cards, desktop gets the table */
        .card-list { display: none; flex-direction: column; gap: 0.625rem; }
        .r-card {
            border: 1px solid var(--stone-200); border-radius: 0.625rem; background: white;
            padding: 0.75rem 0.875rem; cursor: pointer;
        }
        .r-card:active { transform: scale(0.995); }
        body.dark .r-card { background: var(--stone-950); border-color: var(--stone-800); }
        .r-card-top { display: flex; justify-content: space-between; gap: 0.75rem; align-items: baseline; }
        .r-card-name { font-weight: 650; font-size: 0.95rem; line-height: 1.3; }
        .r-card-meta { font-size: 0.8rem; color: var(--stone-500); margin-top: 0.15rem; }
        body.dark .r-card-meta { color: var(--stone-400); }
        .r-card-tags { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.5rem; }
        .r-card-actions { display: flex; gap: 1rem; margin-top: 0.625rem; padding-top: 0.5rem; border-top: 1px solid var(--stone-200); }
        body.dark .r-card-actions { border-color: var(--stone-800); }
        .r-card-action { font-size: 0.8rem; color: var(--sienna-600); text-decoration: none; }
        body.dark .r-card-action { color: var(--sienna-400); }

        @media (max-width: 767px) {
            .header { padding: 1rem; padding-top: max(1rem, env(safe-area-inset-top)); }
            .main { padding: 0.75rem; padding-bottom: max(0.75rem, env(safe-area-inset-bottom)); overflow-x: hidden; }
            .select-group { width: 100%; }
            select { flex: 1; min-width: 0; }
            table { display: none; }
            .card-list { display: flex; }
            .map-view { grid-template-columns: 1fr; grid-template-rows: 55vh minmax(0, 1fr); }
        }

        /* Print Styles */
        @media print {
            body {
                background: white !important;
                color: black !important;
            }

            .header {
                background: white !important;
                box-shadow: none !important;
                border-bottom: 2px solid #000;
                padding-bottom: 1rem;
            }

            .theme-btn, .export-btn, .filters-wrapper, .filter-chips, .modal-overlay, .modal {
                display: none !important;
            }

            .main {
                padding: 0 !important;
                background: white !important;
            }

            table {
                page-break-inside: avoid;
            }

            thead {
                display: table-header-group;
            }

            tr {
                page-break-inside: avoid;
            }

            td, th {
                border: 1px solid #ddd !important;
                padding: 0.5rem !important;
            }

            th {
                background: #f5f5f4 !important;
                color: #000 !important;
            }

            tbody tr:nth-child(even) {
                background: #fafaf9 !important;
            }

            a {
                text-decoration: underline;
                color: #000 !important;
            }

            a[href]:after {
                content: " (" attr(href) ")";
                font-size: 0.8em;
            }

            .stats {
                color: #000 !important;
                margin-top: 0.5rem;
            }

            h1 {
                color: #000 !important;
                font-size: 1.5rem !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-row">
                <div>
                    <h1>Knoxville Restaurants</h1>
                    <p class="stats" id="stats">Loading...</p>
                    <p class="site-note">A small project by <a href="https://joshre.com/">Josh Reeder-Esparza</a>.</p>
                </div>
                <div class="header-actions">
                    <button class="export-btn" onclick="exportToCSV()">Export CSV</button>
                    <button class="theme-btn" onclick="toggleTheme()">Toggle Theme</button>
                </div>
            </div>

            <div class="filters-wrapper">
                <div class="search-wrapper">
                    <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <input type="text" id="search" class="search-input" placeholder="Search restaurants..." aria-label="Search restaurants" role="searchbox">
                </div>

                <div class="filter-row">
                    <div class="select-group" role="group" aria-label="Restaurant filters">
                        <select id="cuisine-filter" aria-label="Filter by cuisine type">
                            <option value="">Cuisine</option>
                        </select>
                        <select id="price-filter" aria-label="Filter by price range">
                            <option value="">Price</option>
                            <option value="$">$ (Under $15)</option>
                            <option value="$$">$$ ($15-25)</option>
                            <option value="$$$">$$$ ($25-40)</option>
                            <option value="$$$$">$$$$ ($40+)</option>
                        </select>
                        <select id="neighborhood-filter" aria-label="Filter by neighborhood">
                            <option value="">Area</option>
                        </select>
                        <select id="group-filter" aria-label="Filter by special group">
                            <option value="">Tag</option>
                        </select>
                    </div>

                    <div class="quick-filters" role="group" aria-label="Quick filter toggles">
                        <button id="new-filter" class="quick-filter" onclick="toggleFilter('new')" aria-label="Toggle new restaurants filter" aria-pressed="false">
                            <svg width="16" height="16" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
                            New
                        </button>
                        <button id="coffee-filter" class="quick-filter" onclick="toggleFilter('coffee')" aria-label="Toggle coffee shops filter" aria-pressed="false">
                            <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 3H4v10c0 2.21 1.79 4 4 4h6c2.21 0 4-1.79 4-4v-3h2c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 5h-2V5h2v3zM4 19h16v2H4z"/></svg>
                        </button>
                        <button id="map-filter" class="quick-filter" onclick="toggleMapView()" aria-label="Toggle map view" aria-pressed="false">
                            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
                            Map
                        </button>
                        <button id="clear-filters" class="hidden clear-btn" onclick="clearFilters()" aria-label="Clear all filters">Clear</button>
                    </div>
                </div>

                <div id="filter-chips" class="hidden filter-chips"></div>
            </div>
        </div>

        <div class="main" role="main">
            <div id="loading" class="loading" role="status" aria-live="polite" aria-label="Loading restaurants">
                <div class="spinner"></div>
            </div>

            <table id="restaurants-table" class="hidden" role="table" aria-label="Restaurant directory">
                <thead>
                    <tr>
                        <th><button onclick="sortBy('name')" aria-label="Sort by restaurant name">Restaurant <span id="sort-name" aria-hidden="true"></span></button></th>
                        <th><button onclick="sortBy('cuisine_type')" aria-label="Sort by cuisine type">Cuisine <span id="sort-cuisine_type" aria-hidden="true"></span></button></th>
                        <th>Location</th>
                        <th><button onclick="sortBy('price_range')" aria-label="Sort by price range">Price <span id="sort-price_range" aria-hidden="true"></span></button></th>
                        <th><button onclick="sortBy('opening_date')" aria-label="Sort by opening date">Opened <span id="sort-opening_date" aria-hidden="true"></span></button></th>
                        <th>Tags</th>
                    </tr>
                </thead>
                <tbody id="restaurants-tbody"></tbody>
            </table>

            <div id="card-list" class="card-list" role="list" aria-label="Restaurant directory"></div>

            <div id="map-view" class="hidden map-view">
                <div id="map-canvas" class="map-canvas"></div>
                <div class="map-panel">
                    <div class="map-panel-head">
                        <span id="map-panel-count">0 mapped</span>
                        <button id="map-fit" class="map-panel-btn" onclick="fitMapToResults()">Fit to results</button>
                    </div>
                    <div id="map-panel-list" class="map-panel-list"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-name">
        <div class="modal-wrapper">
            <div class="modal-grid">
                <div class="modal-content">
                    <div class="modal-header">
                        <div style="flex: 1;">
                            <h2 class="modal-title" id="modal-name"></h2>
                            <p class="modal-meta" id="modal-meta"></p>
                        </div>
                        <button class="modal-close" onclick="closeModal()" aria-label="Close restaurant details">&times;</button>
                    </div>
                    <div class="modal-body" id="modal-body"></div>
                    <div class="modal-actions">
                        <button class="modal-btn" onclick="closeModal()">Close</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="restaurants-data.js"></script>
    <script>
        let allRestaurants = [];
        let filteredRestaurants = [];
        const SORT_COLUMNS = ['name', 'cuisine_type', 'price_range', 'opening_date'];
        let currentSort = { column: 'name', order: 'asc' };

        document.addEventListener('DOMContentLoaded', () => {
            allRestaurants = RESTAURANTS || [];
            populateFilters();
            loadStateFromURL();
            setupEventListeners();

            if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.body.classList.add('dark');
            }
        });

        function setupEventListeners() {
            document.getElementById('search').addEventListener('input', filterRestaurants);
            document.getElementById('cuisine-filter').addEventListener('change', filterRestaurants);
            document.getElementById('price-filter').addEventListener('change', filterRestaurants);
            document.getElementById('neighborhood-filter').addEventListener('change', filterRestaurants);
            document.getElementById('group-filter').addEventListener('change', filterRestaurants);
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
            window.addEventListener('popstate', loadStateFromURL);
        }

        function loadStateFromURL() {
            const params = new URLSearchParams(window.location.search);

            if (params.has('q')) document.getElementById('search').value = params.get('q');
            if (params.has('cuisine')) document.getElementById('cuisine-filter').value = params.get('cuisine');
            if (params.has('price')) document.getElementById('price-filter').value = params.get('price');
            if (params.has('neighborhood')) document.getElementById('neighborhood-filter').value = params.get('neighborhood');
            if (params.has('group')) document.getElementById('group-filter').value = params.get('group');
            if (params.has('new')) {
                const btn = document.getElementById('new-filter');
                btn.dataset.active = 'true';
                btn.classList.add('active-new');
                btn.setAttribute('aria-pressed', 'true');
            }
            if (params.has('coffee')) {
                const btn = document.getElementById('coffee-filter');
                btn.dataset.active = 'true';
                btn.classList.add('active-coffee');
                btn.setAttribute('aria-pressed', 'true');
            }
            const sort = params.get('sort');
            const order = params.get('order');
            if (SORT_COLUMNS.includes(sort)) currentSort.column = sort;
            if (['asc', 'desc'].includes(order)) currentSort.order = order;

            filterRestaurants();
            renderSortIndicators();
        }

        function saveStateToURL() {
            const params = new URLSearchParams();
            const search = document.getElementById('search').value;
            const cuisine = document.getElementById('cuisine-filter').value;
            const price = document.getElementById('price-filter').value;
            const neighborhood = document.getElementById('neighborhood-filter').value;
            const group = document.getElementById('group-filter').value;
            const showNew = document.getElementById('new-filter').dataset.active === 'true';
            const showCoffee = document.getElementById('coffee-filter').dataset.active === 'true';

            if (search) params.set('q', search);
            if (cuisine) params.set('cuisine', cuisine);
            if (price) params.set('price', price);
            if (neighborhood) params.set('neighborhood', neighborhood);
            if (group) params.set('group', group);
            if (showNew) params.set('new', '1');
            if (showCoffee) params.set('coffee', '1');
            if (currentSort.column !== 'name') params.set('sort', currentSort.column);
            if (currentSort.order !== 'asc') params.set('order', currentSort.order);

            const newURL = params.toString() ? '?' + params.toString() : window.location.pathname;
            window.history.replaceState({}, '', newURL);
        }

        function populateFilters() {
            const cuisines = [...new Set(allRestaurants.map(r => r.cuisine_type))].sort();
            const neighborhoods = [...new Set(allRestaurants.map(r => r.area).filter(a => a))].sort();
            const groups = [...new Set(allRestaurants.flatMap(r => (r.tags || []).filter(t => t.startsWith('group_') || t.startsWith('chef_'))))].sort();

            const cuisineFilter = document.getElementById('cuisine-filter');
            cuisines.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c;
                cuisineFilter.appendChild(opt);
            });

            const neighborhoodFilter = document.getElementById('neighborhood-filter');
            neighborhoods.forEach(n => {
                const opt = document.createElement('option');
                opt.value = n;
                opt.textContent = n;
                neighborhoodFilter.appendChild(opt);
            });

            const groupFilter = document.getElementById('group-filter');
            groups.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g;
                opt.textContent = formatGroupName(g);
                groupFilter.appendChild(opt);
            });
        }

        function formatGroupName(tag) {
            const cleaned = tag.replace(/^(group_|chef_)/, '');
            const formatted = cleaned.split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
            return tag.startsWith('chef_') ? 'Chef: ' + formatted : formatted;
        }

        function toggleFilter(type) {
            const btn = document.getElementById(type + '-filter');
            const isActive = btn.dataset.active === 'true';
            btn.dataset.active = !isActive;
            btn.setAttribute('aria-pressed', !isActive);

            if (type === 'new') {
                btn.classList.toggle('active-new');
            } else if (type === 'coffee') {
                btn.classList.toggle('active-coffee');
            }

            filterRestaurants();
        }

        function exportToCSV() {
            const headers = ['Name', 'Cuisine', 'Price', 'Address', 'Phone', 'Website', 'Opening Date'];
            const csvRows = [headers.join(',')];

            filteredRestaurants.forEach(r => {
                const row = [
                    escapeCSV(r.name),
                    escapeCSV(r.cuisine_type),
                    escapeCSV(r.price_range),
                    escapeCSV(r.address),
                    escapeCSV(r.phone || ''),
                    escapeCSV(r.website || ''),
                    r.opening_date || ''
                ];
                csvRows.push(row.join(','));
            });

            const csvContent = csvRows.join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);

            link.setAttribute('href', url);
            link.setAttribute('download', 'knoxville-restaurants-' + new Date().toISOString().split('T')[0] + '.csv');
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        function escapeCSV(str) {
            if (!str) return '';
            str = String(str);
            if (str.includes(',') || str.includes('"') || str.includes('\n')) {
                return '"' + str.replace(/"/g, '""') + '"';
            }
            return str;
        }

        function externalUrl(url) {
            // a schemeless host resolves relative to this page and 404s
            return /^[a-z][a-z0-9+.-]*:/i.test(url) ? url : 'https://' + url;
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function clearFilters() {
            document.getElementById('search').value = '';
            document.getElementById('cuisine-filter').value = '';
            document.getElementById('price-filter').value = '';
            document.getElementById('neighborhood-filter').value = '';
            document.getElementById('group-filter').value = '';

            ['new', 'coffee'].forEach(type => {
                const btn = document.getElementById(type + '-filter');
                btn.dataset.active = 'false';
                btn.classList.remove('active-new', 'active-coffee');
            });

            filterRestaurants();
        }

        function filterRestaurants() {
            const search = document.getElementById('search').value.toLowerCase();
            const cuisine = document.getElementById('cuisine-filter').value;
            const price = document.getElementById('price-filter').value;
            const neighborhood = document.getElementById('neighborhood-filter').value;
            const group = document.getElementById('group-filter').value;
            const showNew = document.getElementById('new-filter').dataset.active === 'true';
            const showCoffee = document.getElementById('coffee-filter').dataset.active === 'true';

            filteredRestaurants = allRestaurants.filter(r => {
                if (search && !matchesSearch(r, search)) return false;
                if (cuisine && r.cuisine_type !== cuisine) return false;
                if (price && r.price_range !== price) return false;
                if (neighborhood && r.area !== neighborhood) return false;
                if (group && !(r.tags || []).includes(group)) return false;
                if (showNew && !isNewRestaurant(r)) return false;
                if (showCoffee && !r.cuisine_type.toLowerCase().includes('coffee') && !r.cuisine_type.toLowerCase().includes('cafe')) return false;
                return true;
            });

            applySorting();
            renderRestaurants();

            const hasFilters = search || cuisine || price || neighborhood || group || showNew || showCoffee;
            document.getElementById('clear-filters').classList.toggle('hidden', !hasFilters);

            renderFilterChips(search, cuisine, price, neighborhood, group, showNew, showCoffee);
            saveStateToURL();
        }

        function renderFilterChips(search, cuisine, price, neighborhood, group, showNew, showCoffee) {
            const container = document.getElementById('filter-chips');
            const chips = [];

            if (search) {
                chips.push({ label: `Search: "${search}"`, type: 'search' });
            }
            if (cuisine) {
                chips.push({ label: `Cuisine: ${cuisine}`, type: 'cuisine' });
            }
            if (price) {
                chips.push({ label: `Price: ${price}`, type: 'price' });
            }
            if (neighborhood) {
                chips.push({ label: `Area: ${neighborhood}`, type: 'neighborhood' });
            }
            if (group) {
                chips.push({ label: formatGroupName(group), type: 'group' });
            }
            if (showNew) {
                chips.push({ label: 'New Restaurants', type: 'new' });
            }
            if (showCoffee) {
                chips.push({ label: 'Coffee Shops', type: 'coffee' });
            }

            if (chips.length === 0) {
                container.classList.add('hidden');
                return;
            }

            container.classList.remove('hidden');
            container.innerHTML = chips.map(chip => `
                <span class="filter-chip">
                    ${chip.label}
                    <button class="filter-chip-remove" onclick="removeFilterChip('${chip.type}')" aria-label="Remove filter">
                        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </span>
            `).join('');
        }

        function removeFilterChip(type) {
            if (type === 'search') {
                document.getElementById('search').value = '';
            } else if (type === 'cuisine') {
                document.getElementById('cuisine-filter').value = '';
            } else if (type === 'price') {
                document.getElementById('price-filter').value = '';
            } else if (type === 'neighborhood') {
                document.getElementById('neighborhood-filter').value = '';
            } else if (type === 'group') {
                document.getElementById('group-filter').value = '';
            } else if (type === 'new') {
                const btn = document.getElementById('new-filter');
                btn.dataset.active = 'false';
                btn.classList.remove('active-new');
            } else if (type === 'coffee') {
                const btn = document.getElementById('coffee-filter');
                btn.dataset.active = 'false';
                btn.classList.remove('active-coffee');
            }
            filterRestaurants();
        }

        function normalizeText(text) {
            return text.toLowerCase().replace(/[^\w\s]/g, '');
        }

        function matchesSearch(r, search) {
            const normalizedSearch = normalizeText(search);
            return normalizeText(r.name).includes(normalizedSearch) ||
                   normalizeText(r.cuisine_type).includes(normalizedSearch) ||
                   normalizeText(r.description || '').includes(normalizedSearch) ||
                   normalizeText(r.highlights || '').includes(normalizedSearch) ||
                   (r.tags || []).some(t => normalizeText(t).includes(normalizedSearch));
        }

        function highlightText(text, search) {

            let normalizedCount = 0;
            while (normalizedCount < normalizedIndex && originalIndex < text.length) {
                if (/[\w\s]/.test(text[originalIndex])) {

            let matchedNormalized = 0;
            while (matchedNormalized < normalizedSearch.length && endIndex < text.length) {
                if (/[\w\s]/.test(text[endIndex])) {

                }
                endIndex++;
            }

            const before = text.substring(0, originalIndex);
            const match = text.substring(originalIndex, endIndex);

// --- shared from cortex-web/src/lib/restaurant-format.js ---
// canonical presentation logic for both consumers; `cortex export-restaurants` include_str!s this file

const DAYS = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
const DAY_LABELS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
// the corpus uses both full and three-letter weekday keys; reading only one
// silently drops the whole Hours block for the other set
const DAY_ALIASES = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];

function parseTags(tags) {
  if (Array.isArray(tags)) return tags;
  if (typeof tags !== 'string' || tags === '') return [];
  const trimmed = tags.trim();
  if (trimmed.startsWith('[')) {
    try {
      const parsed = JSON.parse(trimmed);
      return Array.isArray(parsed) ? parsed : [];
    } catch {
      return [];
    }
  }
  // the corpus stores plenty of tag lists comma-separated rather than as JSON
  return trimmed
    .split(',')
    .map((t) => t.trim())
    .filter(Boolean);
}

const isGroupTag = (tag) => tag.startsWith('group_') || tag.startsWith('chef_');

function displayTags(tags) {
  return parseTags(tags).filter((t) => !isGroupTag(t));
}

function groupTags(tags) {
  return parseTags(tags).filter(isGroupTag);
}

function formatTag(tag) {
  return tag.replace(/_/g, ' ');
}

function formatGroupName(tag) {
  const cleaned = tag.replace(/^(group_|chef_)/, '');
  const formatted = cleaned
    .split('_')
    .map((w) => w.charAt(0).toUpperCase() + w.slice(1))
    .join(' ');
  return tag.startsWith('chef_') ? `Chef: ${formatted}` : formatted;
}

// 1-4, so callers can style by tier without re-parsing the symbol
function priceTier(price) {
  if (typeof price !== 'string') return 0;
  const dollars = price.match(/\$/g);
  return dollars ? Math.min(dollars.length, 4) : 0;
}

const NEW_WINDOW_DAYS = 365;

function openingInfo(openingDate, now = null) {
  if (!openingDate) return { isNew: false, label: '' };
  const opened = new Date(openingDate);
  if (Number.isNaN(opened.getTime())) return { isNew: false, label: '' };
  const ref = now ? new Date(now) : new Date();
  const days = (ref.getTime() - opened.getTime()) / 86400000;
  return {
    isNew: days >= 0 && days <= NEW_WINDOW_DAYS,
    label: opened.toLocaleDateString('en-US', { month: 'short', year: 'numeric' }),
  };
}

function to12Hour(hhmm) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(hhmm.trim());
  if (!m) return hhmm.trim();
  let h = Number(m[1]);
  const suffix = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return m[2] === '00' ? `${h} ${suffix}` : `${h}:${m[2]} ${suffix}`;
}

function prettyRange(value) {
  if (typeof value !== 'string') return '';
  const v = value.trim();
  if (!v || /^closed$/i.test(v)) return 'Closed';
  const parts = v.split('-');
  if (parts.length !== 2) return v;
  return `${to12Hour(parts[0])} – ${to12Hour(parts[1])}`;
}

/**
 * Hours are stored two ways in the corpus: a JSON object keyed by weekday, or a
 * free-text string. Returns { rows: [{label, value, isToday}], text } — `rows` is
 * empty for the free-text form, which callers render via `text` instead.
 */
function formatHours(hours, todayIndex = null) {
  if (!hours || typeof hours !== 'string') return { rows: [], text: '' };
  const trimmed = hours.trim();
  if (!trimmed) return { rows: [], text: '' };

  if (trimmed.startsWith('{')) {
    let parsed;
    try {
      parsed = JSON.parse(trimmed);
    } catch {
      return { rows: [], text: trimmed };
    }
    const lower = {};
    for (const [k, v] of Object.entries(parsed)) lower[k.toLowerCase().trim()] = v;

    const idx = todayIndex === null ? new Date().getDay() : todayIndex;
    const rows = DAYS.map((day, i) => ({
      label: DAY_LABELS[i],
      value: prettyRange(lower[day] ?? lower[DAY_ALIASES[i]]),
      isToday: i === idx,
    })).filter((r) => r.value);

    // some records carry a free-text note alongside the day keys
    const note = lower.notes ?? lower.note;
    return { rows, text: typeof note === 'string' ? note : '' };
  }

  return { rows: [], text: trimmed };
}

function matchesSearch(restaurant, term) {
  if (!term) return true;
  const q = term.toLowerCase();
  const haystack = [
    restaurant.name,
    restaurant.cuisine_type,
    restaurant.description,
    restaurant.area,
    restaurant.address,
    ...parseTags(restaurant.tags).map(formatTag),
  ];
  return haystack.some((f) => typeof f === 'string' && f.toLowerCase().includes(q));
}

function compareRestaurants(a, b, column, order = 'asc') {
  const dir = order === 'desc' ? -1 : 1;
  let result = 0;

  if (column === 'price_range') {
    result = priceTier(a.price_range) - priceTier(b.price_range);
  } else if (column === 'opening_date') {
    const av = a.opening_date ? new Date(a.opening_date).getTime() : 0;
    const bv = b.opening_date ? new Date(b.opening_date).getTime() : 0;
    result = av - bv;
  } else {
    const av = (a[column] ?? '').toString().toLowerCase();
    const bv = (b[column] ?? '').toString().toLowerCase();
    result = av.localeCompare(bv);
  }

  if (result !== 0) return result * dir;
  return (a.name ?? '').localeCompare(b.name ?? '');
}

        paint: {
          'raster-hue-rotate': -8,
          'raster-saturation': -0.05,
          'raster-opacity': 0.95,
        },
      },
    ],
  };
}

// setTiles keeps every restaurant layer intact; setStyle would tear them all down
function setBasemap(map, dark) {
  const source = map.getSource('carto');
  if (!source || typeof source.setTiles !== 'function') return;
  source.setTiles([dark ? BASEMAP_TILES.dark : BASEMAP_TILES.light]);
}

function hasUsableCoordinates(restaurant) {
  const lat = Number(restaurant?.latitude);
  const lon = Number(restaurant?.longitude);
  return (
    restaurant?.latitude !== null &&
    restaurant?.latitude !== undefined &&
    restaurant?.longitude !== null &&
    restaurant?.longitude !== undefined &&
    Number.isFinite(lat) &&
    Number.isFinite(lon)
  );
}

function mappableRestaurants(restaurants) {
  return (restaurants || []).filter(hasUsableCoordinates);
}

const defaultIdOf = (restaurant, index) =>
  restaurant?.id !== undefined && restaurant?.id !== null ? String(restaurant.id) : String(index);

function buildFeatureCollection(restaurants, idOf = defaultIdOf) {
  const features = [];
  (restaurants || []).forEach((restaurant, index) => {
    if (!hasUsableCoordinates(restaurant)) return;
    features.push({
      type: 'Feature',
      // setFeatureState needs a numeric id, so the caller's key rides in properties
      id: features.length,
      geometry: {
        type: 'Point',
        coordinates: [Number(restaurant.longitude), Number(restaurant.latitude)],
      },
      properties: {
        key: idOf(restaurant, index),
        name: restaurant.name,
        cuisine: restaurant.cuisine_type || '',
        price: restaurant.price_range || '',
        area: restaurant.area || '',
      },
    });
  });
  return { type: 'FeatureCollection', features };
}

function layerSpecs(dark) {
  const c = dark ? DARK_PALETTE : PALETTE;
  return [
    {
      id: CLUSTER_LAYER_ID,
      type: 'circle',
      source: SOURCE_ID,
      filter: ['has', 'point_count'],
      paint: {
        'circle-color': c.cluster,
        'circle-opacity': 0.9,
        'circle-radius': ['step', ['get', 'point_count'], 14, 10, 18, 30, 24],
        'circle-stroke-width': 2,
        'circle-stroke-color': c.stroke,
      },
    },
    {
      id: CLUSTER_COUNT_LAYER_ID,
      type: 'symbol',
      source: SOURCE_ID,
      filter: ['has', 'point_count'],
      layout: {
        'text-field': ['get', 'point_count_abbreviated'],
        'text-size': 12,
        'text-allow-overlap': true,
      },
      paint: { 'text-color': c.clusterText },
    },
    {
      id: POINT_LAYER_ID,
      type: 'circle',
      source: SOURCE_ID,
      filter: ['!', ['has', 'point_count']],
      paint: {
        'circle-radius': ['case', ['boolean', ['feature-state', 'selected'], false], 9, 6],
        'circle-color': [
          'case',
          ['boolean', ['feature-state', 'selected'], false],
          c.selected,
          c.point,
        ],
        'circle-stroke-width': 2,
        'circle-stroke-color': c.stroke,
      },
    },
    {
      id: LABEL_LAYER_ID,
      type: 'symbol',
      source: SOURCE_ID,
      filter: ['!', ['has', 'point_count']],
      minzoom: 12.5,
      layout: {
        'text-field': ['get', 'name'],
        'text-size': 12,
        'text-offset': [0, 1.15],
        'text-anchor': 'top',
        'text-allow-overlap': false,
      },
      paint: {
        'text-color': c.label,
        'text-halo-color': c.labelHalo,
        'text-halo-width': 1.25,
      },
    },
  ];
}

const wiredMaps = new WeakSet();

// idempotent so a style swap can re-run it
function attachRestaurantLayers(map, { onSelect, dark = false } = {}) {
  if (!map.getSource(SOURCE_ID)) {
    map.addSource(SOURCE_ID, {
      type: 'geojson',
      data: { type: 'FeatureCollection', features: [] },
      cluster: true,
      clusterRadius: 44,
      clusterMaxZoom: 13,
    });
  }

  layerSpecs(dark).forEach((spec) => {
    if (!map.getLayer(spec.id)) map.addLayer(spec);
  });

  // layers are guarded above, but map.on would stack duplicate handlers on a re-run
  if (wiredMaps.has(map)) return;
  wiredMaps.add(map);

  const pointer = (on) => () => {
    map.getCanvas().style.cursor = on ? 'pointer' : '';
  };
  [POINT_LAYER_ID, CLUSTER_LAYER_ID].forEach((id) => {
    map.on('mouseenter', id, pointer(true));
    map.on('mouseleave', id, pointer(false));
  });

  map.on('click', CLUSTER_LAYER_ID, (event) => {
    const feature = event.features?.[0];
    if (!feature) return;
    const source = map.getSource(SOURCE_ID);
    // maplibre 5 returns a promise here, older builds take a callback
    Promise.resolve(source.getClusterExpansionZoom(feature.properties.cluster_id))
      .then((zoom) => {
        map.easeTo({ center: feature.geometry.coordinates, zoom, duration: 350 });
      })
      .catch(() => {});
  });

  if (onSelect) {
    map.on('click', POINT_LAYER_ID, (event) => {
      const key = event.features?.[0]?.properties?.key;
      if (key !== undefined && key !== null) onSelect(String(key));
    });
  }
}

function applyTheme(map, dark) {
  layerSpecs(dark).forEach((spec) => {
    if (!map.getLayer(spec.id)) return;
    Object.entries(spec.paint || {}).forEach(([prop, value]) => {
      map.setPaintProperty(spec.id, prop, value);
    });
  });
}

function syncRestaurantData(map, restaurants, idOf = defaultIdOf) {
  const source = map.getSource(SOURCE_ID);
  if (!source) return null;
  const collection = buildFeatureCollection(restaurants, idOf);
  source.setData(collection);
  return collection;
}

function setSelected(map, collection, key) {
  if (!collection) return;
  collection.features.forEach((feature) => {
    map.setFeatureState(
      { source: SOURCE_ID, id: feature.id },
      { selected: key !== null && key !== undefined && feature.properties.key === String(key) },
    );
  });
}

function boundsOf(maplibregl, restaurants) {
  const mapped = mappableRestaurants(restaurants);
  if (mapped.length === 0) return null;
  const bounds = new maplibregl.LngLatBounds();
  mapped.forEach((restaurant) => {
    bounds.extend([Number(restaurant.longitude), Number(restaurant.latitude)]);
  });
  return bounds;
}

function fitToRestaurants(maplibregl, map, restaurants, options = {}) {
  const bounds = boundsOf(maplibregl, restaurants);
  if (!bounds) return false;
  map.fitBounds(bounds, {
    padding: { top: 48, right: 48, bottom: 48, left: 48 },
    maxZoom: 13.5,
    duration: options.duration ?? 450,
  });
  return true;
}

function readViewport(map) {
  const b = map.getBounds();
  return {
    zoom: map.getZoom(),
    west: b.getWest(),
    south: b.getSouth(),
    east: b.getEast(),
    north: b.getNorth(),
  };
}

function isInViewport(restaurant, viewport) {
  if (!(viewport && hasUsableCoordinates(restaurant))) return false;
  const lat = Number(restaurant.latitude);
  const lon = Number(restaurant.longitude);
  return (
    lon >= viewport.west && lon <= viewport.east && lat >= viewport.south && lat <= viewport.north
  );
}

const VIEWPORT_FILTER_MIN_ZOOM = 12;

// re-fit only when the mapped set itself changes, not on every selection.
// keyed on identity, never on array position: an index-based key collides
// whenever two filters happen to return the same number of results
function mappedSignature(restaurants) {
  return mappableRestaurants(restaurants)
    .map((r) => `${r.name ?? ''}@${Number(r.latitude).toFixed(5)},${Number(r.longitude).toFixed(5)}`)
    .join('|');
}

        window.__restaurantFormat = {
            parseTags, displayTags, groupTags, formatTag, formatGroupName,
            priceTier, openingInfo, formatHours, matchesSearch, compareRestaurants,
        };

        let map = null;
        let collection = null;
        let lastSignature = null;
        let viewport = null;
        let viewportFilterDisabled = false;
        // module scope can't see the classic script's `let`, so the list is handed in
        let currentRestaurants = [];

        // the public record has no id, so the panel and the modal both key on array position
        const byIndex = (_restaurant, index) => String(index);

        function currentList() {
            return currentRestaurants;
        }

        function repaintPanel() {
            const list = currentList();
            const active = viewport && viewport.zoom >= VIEWPORT_FILTER_MIN_ZOOM && !viewportFilterDisabled;
            if (!active) return window.renderMapPanel(null);

            const indices = [];
            list.forEach((r, i) => { if (isInViewport(r, viewport)) indices.push(i); });
            window.renderMapPanel(indices);
        }

        function ensureMap(dark) {
            if (map) return map;

            map = new maplibregl.Map({
                container: 'map-canvas',
                style: rasterStyle(dark),
                center: KNOXVILLE_CENTER,
                zoom: DEFAULT_ZOOM,
                attributionControl: false,
            });
            map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
            map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-right');

            map.on('load', () => {
                attachRestaurantLayers(map, {
                    dark,
                    onSelect: (key) => window.showRestaurantByIndex(Number(key)),
                });
                collection = syncRestaurantData(map, currentList(), byIndex);
                lastSignature = mappedSignature(currentList());
                fitToRestaurants(maplibregl, map, currentList(), { duration: 0 });

                const onMove = (event) => {
                    viewport = readViewport(map);
                    // only a real gesture may cancel the user's own choice
                    if (event && event.originalEvent) viewportFilterDisabled = false;
                    repaintPanel();
                };
                map.on('moveend', onMove);
                map.on('zoomend', onMove);
                viewport = readViewport(map);
                repaintPanel();
            });

            return map;
        }

        window.__restaurantMap = {
            show(restaurants, dark) {
                currentRestaurants = restaurants || [];
                ensureMap(dark);
                if (!map.isStyleLoaded() || !map.getSource('restaurants')) return;

                collection = syncRestaurantData(map, currentRestaurants, byIndex);
                const signature = mappedSignature(currentRestaurants);
                if (signature !== lastSignature) {
                    lastSignature = signature;
                    viewportFilterDisabled = false;
                    fitToRestaurants(maplibregl, map, currentRestaurants);
                }
                map.resize();
                repaintPanel();
            },
            fit(restaurants) {
                if (!map) return;
                currentRestaurants = restaurants || [];
                viewportFilterDisabled = true;
                fitToRestaurants(maplibregl, map, currentRestaurants);
                repaintPanel();
            },
            setTheme(dark) {
                if (!map || !map.isStyleLoaded()) return;
                applyTheme(map, dark);
                setBasemap(map, dark);
            },
        };
    </script>
</body>
</html>
